name: Build Caddy Plus Images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Optional single Caddy version from caddy-versions.txt"
        required: false
        type: string
      push_images:
        description: "Push built images to GHCR and Aliyun ACR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_PLATFORMS: linux/amd64,linux/arm64
  DRY_BUILD_CADDY_VERSION: 2.11.7
  ACR_REPOSITORY: registry.cn-beijing.aliyuncs.com/zhangxl/caddy-plus

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate scripts and manifests
        run: |
          shellcheck scripts/build-image.sh scripts/smoke-test.sh scripts/verify-version.sh
          test -s caddy-versions.txt
          awk 'NF && $1 !~ /^#/ && $1 ~ /^v/ { print "Caddy versions must not start with v: " $1; exit 1 }' caddy-versions.txt
          while IFS= read -r version; do
            case "$version" in ""|\#*) continue ;; esac
            test -s "plugin-matrix/$version.txt"
            awk 'NF && $1 !~ /^#/ && $1 !~ /@/ { print "Plugin entries must pin a version: " $1; exit 1 }' "plugin-matrix/$version.txt"
          done < caddy-versions.txt

  dry-build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build latest supported image without publishing
        env:
          CADDY_VERSION: ${{ env.DRY_BUILD_CADDY_VERSION }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_CACHE: none
          PUSH_IMAGE: "false"
        run: scripts/build-image.sh

      - name: Smoke-test dry build
        env:
          CADDY_VERSION: ${{ env.DRY_BUILD_CADDY_VERSION }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: scripts/smoke-test.sh

  build-images:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image set
        env:
          CADDY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.caddy_version || '' }}
          BUILD_PLATFORM: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)) && env.RELEASE_PLATFORMS || 'linux/amd64' }}
          BUILD_CACHE: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)) && 'gha' || 'none' }}
          PUSH_IMAGE: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)) && 'true' || 'false' }}
          ACR_IMAGE_NAME: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)) && env.ACR_REPOSITORY || '' }}
        run: scripts/build-image.sh

  verify-published:
    needs: build-images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify published images
        env:
          SELECTED_CADDY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.caddy_version || '' }}
        run: |
          platforms="$(printf "%s" "$RELEASE_PLATFORMS" | tr "," " ")"

          if [ -n "$SELECTED_CADDY_VERSION" ]; then
            versions="$SELECTED_CADDY_VERSION"
          else
            versions="$(awk 'NF && $1 !~ /^#/ { print $1 }' caddy-versions.txt)"
          fi

          verify_registry() {
            registry_image="$1"

            for version in $versions; do
              for platform in $platforms; do
                docker pull --platform "$platform" "$registry_image:caddy-$version"
                modules="$(docker run --rm --platform "$platform" "$registry_image:caddy-$version" caddy list-modules)"
                printf "%s\n" "$modules" | grep '^dns\.providers\.alidns$'
                printf "%s\n" "$modules" | grep '^http\.handlers\.waf$'

                IMAGE_NAME="$registry_image" BUILD_PLATFORM="$platform" CADDY_VERSION="$version" scripts/smoke-test.sh
              done
            done
          }

          verify_registry "$IMAGE_NAME"
          verify_registry "$ACR_REPOSITORY"
